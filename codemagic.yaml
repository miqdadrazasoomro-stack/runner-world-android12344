workflows:
  runner-world-android:
    name: RUNNER WORLD Android APK
    max_build_duration: 120
     instance_type: linux

    scripts:
      - name: Prepare game files
        script: |
          mkdir -p www
          cp index.html www/
          cp -R css js assets www/
          test -f www/index.html
          test -f www/js/game.js
          test -f www/js/lib/three.min.js

      - name: Install dependencies
        script: |
          npm install

      - name: Add Android platform
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
